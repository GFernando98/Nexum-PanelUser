<div class="flex flex-column gap-4 p-4">

  <div class="flex align-items-center justify-content-between flex-wrap gap-3">
    <h2 class="m-0">Roles</h2>
    <div class="flex align-items-center gap-3">
      <p-iconfield>
        <p-inputicon styleClass="pi pi-search" />
        <input pInputText [(ngModel)]="search" (ngModelChange)="onSearch()" placeholder="Buscar rol..."
          style="width: 280px" />
      </p-iconfield>
      <p-button *hasPermission="Permission.CanCreateRoles" label="Nuevo rol" icon="pi pi-plus" (onClick)="goToCreate()">
      </p-button>
    </div>
  </div>

  <p-table [value]="roles()" [loading]="loading()" [lazy]="true" [paginator]="true" [rows]="pageSize"
    [totalRecords]="totalRecords()" (onPage)="onPageChange($event)" [rowsPerPageOptions]="[10, 25, 50]"
    [showCurrentPageReport]="true" currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} roles"
    styleClass="p-datatable-gridlines">

    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th style="width: 120px">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-role>
      <tr>
        <td>{{ role.name }}</td>
        <td>
          <div class="flex gap-2">
            <p-button *hasPermission="Permission.CanEditRoles" icon="pi pi-pencil" [text]="true" [rounded]="true"
              severity="info" (onClick)="goToEdit(role.id)" pTooltip="Editar">
            </p-button>
            <p-button *hasPermission="Permission.CanDeleteRoles" icon="pi pi-trash" [text]="true" [rounded]="true"
              severity="danger" (onClick)="confirmDelete(role)" pTooltip="Eliminar">
            </p-button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="2" class="text-center p-4">No se encontraron roles.</td>
      </tr>
    </ng-template>

  </p-table>

</div>

<p-confirmDialog />
<p-toast />
