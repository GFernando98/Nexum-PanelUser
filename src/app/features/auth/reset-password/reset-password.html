<div class="login-wrapper">
    <p-card styleClass="shadow-4" [style]="{ width: '420px', 'max-width': '95vw' }">

        <ng-template pTemplate="header">
            <div class="text-center pt-4 pb-2">
                <h2 class="login-title">Nexum</h2>
                <p class="login-subtitle">Creá tu nueva contraseña</p>
            </div>
        </ng-template>

        @if (!resetDone) {
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="flex flex-column gap-3">

                <div class="flex flex-column gap-1">
                    <label for="newPassword" class="font-medium" style="color: var(--text-primary)">Nueva
                        contraseña</label>
                    <p-password inputId="newPassword" formControlName="newPassword"
                        placeholder="Ingresá tu nueva contraseña" [toggleMask]="true" styleClass="w-full"
                        inputStyleClass="w-full">
                    </p-password>
                    @if (form.get('newPassword')?.invalid && form.get('newPassword')?.touched) {
                    <small style="color: var(--danger)">Mínimo 6 caracteres.</small>
                    }
                </div>

                @if (error) {
                <p-message severity="error" styleClass="w-full">{{ error }}</p-message>
                }

                <p-button type="submit" label="Restablecer contraseña" icon="pi pi-lock" styleClass="w-full"
                    [loading]="loading" [disabled]="form.invalid || loading">
                </p-button>

            </div>
        </form>
        } @else {
        <div class="flex flex-column gap-3 text-center">
            <i class="pi pi-check-circle text-5xl" style="color: var(--green-500)"></i>
            <p>Tu contraseña fue restablecida correctamente.</p>
            <p-button label="Iniciar sesión" icon="pi pi-sign-in" styleClass="w-full" routerLink="/auth/login">
            </p-button>
        </div>
        }

    </p-card>
</div>
