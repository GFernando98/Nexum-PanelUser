<div class="flex flex-column gap-4 p-4">

    <div class="flex align-items-center justify-content-between flex-wrap gap-3">
        <h2 class="m-0">Usuarios</h2>
        <div class="flex align-items-center gap-3">
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText [(ngModel)]="search" (ngModelChange)="onSearch()" placeholder="Buscar usuario..."
                    style="width: 280px" />
            </p-iconfield>
            <p-button *hasPermission="Permission.CanCreateUsers" label="Nuevo usuario" icon="pi pi-plus"
                (onClick)="goToCreate()">
            </p-button>
        </div>
    </div>

    <p-table [value]="users()" [loading]="loading()" [lazy]="true" [paginator]="true" [rows]="pageSize"
        [totalRecords]="totalRecords()" (onPage)="onPageChange($event)" [rowsPerPageOptions]="[10, 25, 50]"
        [showCurrentPageReport]="true" currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} usuarios"
        styleClass="p-datatable-gridlines">

        <ng-template pTemplate="header">
            <tr>
                <th>Nombre</th>
                <th>Usuario</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Estado</th>
                <th style="width: 120px">Acciones</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-user>
            <tr>
                <td>{{ user.firstName }} {{ user.lastName }}</td>
                <td>{{ user.userName }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.phoneNumber ?? '—' }}</td>
                <td>
                    <p-tag [value]="user.isActive ? 'Activo' : 'Inactivo'"
                        [severity]="user.isActive ? 'success' : 'danger'">
                    </p-tag>
                </td>
                <td>
                    <div class="flex gap-2">
                        <p-button *hasPermission="Permission.CanEditUsers" icon="pi pi-pencil" [text]="true"
                            [rounded]="true" severity="info" (onClick)="goToEdit(user.id)" pTooltip="Editar">
                        </p-button>
                        <p-button *hasPermission="Permission.CanDeleteUsers" icon="pi pi-trash" [text]="true"
                            [rounded]="true" severity="danger" (onClick)="confirmDelete(user)" pTooltip="Eliminar">
                        </p-button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center p-4">No se encontraron usuarios.</td>
            </tr>
        </ng-template>

    </p-table>

</div>

<p-confirmDialog />
<p-toast />
